[project]
name = "s3-kit"
version = "0.1.0"
description = "S3 儲存 Provider，用同一套 API 操作 AWS S3 及相容服務"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.36"]

[project.optional-dependencies]
example = ["fastapi>=0.115", "python-multipart>=0.0.20", "uvicorn>=0.34"]

[dependency-groups]
dev = ["moto[s3]>=5", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_kit"]
