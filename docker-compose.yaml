name: s3-kit-example

services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-s3kit-local}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-s3kit-local-secret}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: examples/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: s3-kit
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-s3kit-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-s3kit-local-secret}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      rustfs:
        condition: service_healthy

volumes:
  rustfs-data:
