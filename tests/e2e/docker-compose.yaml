name: s3-kit-e2e

services:
  rustfs:
    image: rustfs/rustfs:1.0.4
    ports:
      - "127.0.0.1:19000:9000"
    environment:
      RUSTFS_ACCESS_KEY: e2e-access-key
      RUSTFS_SECRET_KEY: e2e-secret-key
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  rustfs-data:
